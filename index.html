<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Setup -->
    <title>IEE Store - Premium E-Commerce</title>
    <meta name="description" content="Discover premium products at IEE Store. Shop the latest collections with fast shipping and excellent customer support." />
    <meta name="keywords" content="ecommerce, online shopping, electronics, clothing, premium products" />
    <meta name="author" content="IEE Store" />
    <link rel="canonical" href="https://ieestore.com1/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ieestore.com1/" />
    <meta property="og:title" content="IEE Store - Premium E-Commerce" />
    <meta property="og:description" content="Discover premium products at IEE Store. Shop the latest collections with fast shipping and excellent customer support." />
    <meta property="og:image" content="https://ieestore.com1/hero_banner.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ieestore.com1/" />
    <meta property="twitter:title" content="IEE Store - Premium E-Commerce" />
    <meta property="twitter:description" content="Discover premium products at IEE Store. Shop the latest collections with fast shipping and excellent customer support." />
    <meta property="twitter:image" content="https://ieestore.com1/hero_banner.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "IEE Store",
        "url": "https://ieestore.com1/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ieestore.com1/shop?search={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "publisher": {
          "@type": "Organization",
          "name": "IEE Store",
          "logo": {
            "@type": "ImageObject",
            "url": "https://ieestore.com1/iee-logo.png"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
