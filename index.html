<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Setup -->
    <title>Taicon Store | Solar Energy Systems & Home Products</title>
    <meta name="description" content="Welcome to Taicon Store. Explore premium Solar Energy Systems, Inverters, Lithium Batteries, and Home Appliances with Cash on Delivery across Pakistan." />
    <meta name="keywords" content="taicon store, solar energy, solar panels, inverters, batteries, home products, appliances, solar system pakistan" />
    <meta name="author" content="Taicon Store" />
    <link rel="canonical" href="https://taicon.store/" />

    <!-- Performance & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
    
    <!-- Preload Hero Banners -->
    <link rel="preload" as="image" href="/product_images/herobaner1.png" fetchpriority="high">
    <link rel="preload" as="image" href="/product_images/herobanner2.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taicon.store/" />
    <meta property="og:title" content="Taicon Store | Solar Energy Systems & Home Products" />
    <meta property="og:description" content="Shop Solar Systems, Hybrid Inverters, Lithium Batteries and Home Appliances at Taicon Store." />
    <meta property="og:image" content="/product_images/herobanner2.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://taicon.store/" />
    <meta property="twitter:title" content="Taicon Store | Solar Energy Systems & Home Products" />
    <meta property="twitter:description" content="Shop Solar Systems, Hybrid Inverters, Lithium Batteries and Home Appliances at Taicon Store." />
    <meta property="twitter:image" content="/product_images/herobanner2.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/taicon-logo.png" />
    <meta name="theme-color" content="#f97316" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Taicon Store",
        "url": "https://taicon.store/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://taicon.store/shop?q={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Taicon Store",
          "logo": {
            "@type": "ImageObject",
            "url": "https://taicon.store/taicon-logo.png"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
